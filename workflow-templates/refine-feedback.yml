# Triggered when a [Feedback] issue is opened by the in-app widget.
# Uses GitHub Models (gpt-4o) to rewrite the raw user feedback into a
# structured, developer-ready GitHub issue.
#
# What this workflow does:
#   • Leaves the original [Feedback] issue untouched
#   • Creates a refined [Issue] with a developer-ready body
#   • Copies screenshots from the original feedback into the new issue
#   • Posts a cross-link comment on the original feedback issue
#   • Closes the original [Feedback] issue
#
# Required secrets: none (GITHUB_TOKEN is auto-provided by Actions)
# Optional secrets: ADD_TO_PROJECT_PAT — add to a GitHub Projects v2 board

name: Refine feedback issue

on:
  issues:
    types: [opened]

jobs:
  refine:
    # Only run for [Feedback] issues opened by a human — not by github-actions[bot],
    # which opens the refined [Issue] issues and would create a trigger loop.
    if: "startsWith(github.event.issue.title, '[Bug]') && github.actor != 'github-actions[bot]'"
    runs-on: ubuntu-latest

    permissions:
      issues: write   # create issues, add labels, post comments
      models: read    # GitHub Models API

    steps:
      - name: Refine with GitHub Models (gpt-4o)
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN:       ${{ secrets.GITHUB_TOKEN }}
          ADD_TO_PROJECT_PAT: ${{ secrets.ADD_TO_PROJECT_PAT }}
          # CUSTOMISE: set to your GitHub Projects v2 URL if you use a project board
          PROJECT_URL:        https://github.com/orgs/YOUR_ORG/projects/YOUR_PROJECT_NUMBER
        with:
          script: |
            const issue    = context.payload.issue;
            const rawTitle = issue.title;
            const rawBody  = issue.body ?? '';

            // ── Build the prompt ──────────────────────────────────────────────
            // CUSTOMISE: replace the product name and description below with your own.
            const systemPrompt = `
            You are a senior UX engineer triaging user feedback for a web application.

            You will receive raw feedback submitted via an in-app widget. Your job is to
            rewrite it as a well-structured GitHub issue a developer can act on immediately.

            Rules:
            - Write for a developer audience, not the end user.
            - Be specific: name the UI component, screen, or interaction that is affected.
            - If a screenshot is embedded, describe what it shows and reference it explicitly.
            - Do not invent reproduction steps you cannot infer — mark them "TBD" if unclear.
            - Keep the title under 72 characters, imperative mood (e.g. "Fix...", "Add...").
            - Output ONLY valid JSON — no markdown fences, no extra keys.

            Output schema:
            {
              "title": "string — refined issue title, no prefix",
              "type": "bug | enhancement | ux",
              "priority": "low | medium | high | critical",
              "body": "string — full GitHub issue body in Markdown (see template below)"
            }

            Issue body template (fill every section; write N/A if genuinely unknown):
            ## Summary
            One-sentence description of the problem or request.

            ## User Goal
            What the user was trying to accomplish.

            ## Observed Behaviour
            What actually happened.

            ## Expected Behaviour
            What the user expected instead.

            ## Steps to Reproduce
            1. ...

            ## Affected Component / Screen
            Name the component, panel, or view.

            ## Suggested Fix / Direction
            Brief technical suggestion — or "TBD" if unclear.

            ## Priority Rationale
            Why you chose the priority level above.

            ---
            > 🤖 Refined from raw user feedback by GitHub Models (gpt-4o).
            > Verify the steps to reproduce before assigning.
            `.trim();

            const userMessage = `
            Raw feedback issue:
            Title: ${rawTitle}

            Body:
            ${rawBody}
            `.trim();

            // ── Call GitHub Models API ────────────────────────────────────────
            const apiRes = await fetch(
              'https://models.inference.ai.azure.com/chat/completions',
              {
                method:  'POST',
                headers: {
                  'Authorization': `Bearer ${process.env.GITHUB_TOKEN}`,
                  'Content-Type':  'application/json',
                },
                body: JSON.stringify({
                  model:       'gpt-4o',
                  temperature: 0.2,
                  messages: [
                    { role: 'system', content: systemPrompt },
                    { role: 'user',   content: userMessage },
                  ],
                }),
              }
            );

            if (!apiRes.ok) {
              core.setFailed(`GitHub Models API error: ${await apiRes.text()}`);
              return;
            }

            const aiData  = await apiRes.json();
            const content = aiData.choices?.[0]?.message?.content ?? '';

            let refined;
            try {
              refined = JSON.parse(content);
            } catch {
              core.setFailed(`Could not parse AI response as JSON:\n${content}`);
              return;
            }

            // ── Copy screenshots from original feedback ───────────────────────
            let screenshotsSection = '';
            const screenshotMatch = rawBody.match(/### Screenshots \(\d+\)([\s\S]*?)(?=\n---|\n## |$)/);
            if (screenshotMatch) {
              screenshotsSection = `\n\n## Screenshots\n${screenshotMatch[1].trim()}`;
            }

            // ── Ensure labels exist ───────────────────────────────────────────
            const labelDefs = [
              { name: 'needs-triage', color: 'e4e669', description: 'Awaiting triage'            },
              { name: 'bug',          color: 'd73a4a', description: 'Something is not working'   },
              { name: 'enhancement',  color: 'a2eeef', description: 'New feature or improvement' },
              { name: 'ux',           color: '7057ff', description: 'User experience issue'       },
            ];
            for (const l of labelDefs) {
              try { await github.rest.issues.createLabel({ ...context.repo, ...l }); } catch {}
            }

            // ── Create the refined [Issue] ────────────────────────────────────
            const detailsBlock = '\n\n<details>\n<summary>Original feedback (issue #'
              + issue.number + ')</summary>\n\n' + rawBody + '\n\n</details>';

            const newIssue = await github.rest.issues.create({
              ...context.repo,
              title:  `[Issue] ${refined.title}`,
              body:   refined.body + screenshotsSection + detailsBlock,
              labels: ['needs-triage', refined.type, `priority: ${refined.priority}`].filter(Boolean),
            });

            // ── Label the original feedback issue ─────────────────────────────
            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: issue.number,
              labels: ['needs-triage'],
            });

            // ── Post cross-link comment ───────────────────────────────────────
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: issue.number,
              body: [
                '### 🤖 Feedback refined by GitHub Models',
                '',
                `A developer-ready issue has been created: **#${newIssue.data.number}**`,
                '',
                `**Type:** ${refined.type}  `,
                `**Priority:** ${refined.priority}  `,
                '',
                'This original feedback issue is preserved as-is for reference.',
              ].join('\n'),
            });

            core.info(`Feedback #${issue.number} → refined issue #${newIssue.data.number}`);

            // ── Add to project board (optional) ───────────────────────────────
            const pat = process.env.ADD_TO_PROJECT_PAT;
            if (pat) {
              const projectUrl = process.env.PROJECT_URL ?? '';
              const match = projectUrl.match(/orgs\/([^/]+)\/projects\/(\d+)/);
              if (match) {
                const [, org, projectNum] = match;
                const gql = async (query) => {
                  const r = await fetch('https://api.github.com/graphql', {
                    method:  'POST',
                    headers: { 'Authorization': `Bearer ${pat}`, 'Content-Type': 'application/json' },
                    body:    JSON.stringify({ query }),
                  });
                  return r.json();
                };
                const pd = await gql(`query { organization(login: "${org}") { projectV2(number: ${projectNum}) { id } } }`);
                const projectId = pd.data?.organization?.projectV2?.id;
                if (projectId) {
                  await gql(`mutation { addProjectV2ItemById(input: { projectId: "${projectId}", contentId: "${newIssue.data.node_id}" }) { item { id } } }`);
                  core.info(`Added #${newIssue.data.number} to project board.`);
                }
              }
            }

            // ── Close the original feedback issue ─────────────────────────────
            await github.rest.issues.update({
              ...context.repo,
              issue_number: issue.number,
              state:        'closed',
              state_reason: 'completed',
            });
            core.info(`Original feedback issue #${issue.number} closed.`);
